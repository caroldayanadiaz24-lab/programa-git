    <title>Perfil - Estilo y Moda 365</title>

    <link rel="stylesheet" href="css/estilos.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            border-radius: 10px;
        }

        .dato {
            padding: 15px;

            border-radius: 8px;
        }

        .boton {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 15px;
        }

        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            padding: 10px 0;
            text-align: center;
        }

      nav a {
    display: inline-block;
    background: #222;
    color: white;
    padding: 8px 5px;
    margin: 2px;
    border-radius: 7px;
    text-decoration: none;
    font-size: 10px;
}
    </style>
</head>
