    <title>Categorías - Estilo y Moda 365</title>

    <link rel="stylesheet" href="css/estilos.css">

    
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding-bottom: 70px;
        }

        header {
            background: white;
            text-align: center;
            padding: 20px;
        }

        .logo {
            width: 100px;
        }

        h1 {
            margin: 10px;
        }

        .categorias {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .categoria {
            background: white;
            padding: 30px 10px;
            text-align: center;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .categoria button {
            background: #222;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            padding: 10px 0;
            text-align: center;
        }

        nav a {
            background: #222;
            color: white;
            padding: 9px;
            margin: 2px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 12px;
        }
    </style>
</head>
