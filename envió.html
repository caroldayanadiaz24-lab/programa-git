<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Datos del envío - Estilo y Moda 365</title>

    <link rel="stylesheet" href="css/estilos.css">

    <style>

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            text-align: center;
            padding: 10px;
        }

        header h1 {
            font-size: 24px;
            margin: 10px 0;
        }

        .contenido {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .formulario,
        .resumen {
            background-color: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }

        h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 3px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        .producto {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 14px;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }

        .continuar {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background-color: #222;
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            margin-top: 18px;
        }

        .continuar:hover {
            background-color: #444;
        }

    </style>

</head>

<body>

    <header>

        <h1>
            Datos del envío
        </h1>

    </header>


    <section class="contenido">


        <!-- INFORMACIÓN PERSONAL -->

        <div class="formulario">

            <h2>
                Información personal
            </h2>

            <label>
                Nombres completos
            </label>

            <input
                type="text"
                placeholder="Tu nombre">


            <label>
                Teléfono
            </label>

            <input
                type="tel"
                placeholder="Tu número de celular">


            <label>
                Dirección de envío
            </label>

            <input
                type="text"
                placeholder="Calle, carrera, etc.">


            <label>
                Ciudad
            </label>

            <select>

                <option>
                    Seleccione una ciudad
                </option>

                <option>
                    Bogotá
                </option>

                <option>
                    Tunja
                </option>

                <option>
                    Medellín
                </option>

                <option>
                    Manizales
                </option>

                <option>
                    Otra ciudad
                </option>

            </select>

        </div>


        <!-- RESUMEN DEL PEDIDO -->

        <div class="resumen">

            <h2>
                Resumen de pedido
            </h2>


            <div class="producto">

                <span>
                    Vestido casual
                </span>

                <strong>
                    $89.900
                </strong>

            </div>


            <div class="producto">

                <span>
                    Envío
                </span>

                <strong>
                    $10.000
                </strong>

            </div>


            <div class="total">

                <span>
                    Total
                </span>

                <strong>
                    $99.900
                </strong>

            </div>


            <a
                href="pago.html"
                class="continuar">

                Continuar

            </a>

        </div>


    </section>

    <script src="js/script.js"></script>

</body>

</html>
