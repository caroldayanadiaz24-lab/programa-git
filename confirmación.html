<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedido confirmado - Estilo y Moda 365</title>

    <link rel="stylesheet" href="css/estilos.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            padding: 30px;
        }

        .confirmacion {
            background-color: white;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ccc;
        }

        .circulo {
    width: 80px;
    height: 80px;
    background-color: #28a745;
    color: white;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 45px;
}

        h1 {
            margin-bottom: 10px;
        }

        .pedido {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .boton {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-top: 12px;
            background-color: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="confirmacion">

        <div class="circulo">✓</div>

        <h1>¡Pedido confirmado!</h1>

        <p>Tu pedido ha sido realizado correctamente.</p>

        <div class="pedido">
            <p><strong>Número de pedido:</strong> #EM365001</p>
            <p><strong>Total:</strong> $229.900</p>
        </div>

        <a href="carrito.html" class="boton">
            Ver pedido
        </a>

        <a href="inicio.html" class="boton">
            Volver al inicio
        </a>

    </div>

     <script src="js/script.js"></script>

</body>
</html>
