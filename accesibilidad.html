<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accesibilidad - Estilo y Moda 365</title>

    <link rel="stylesheet" href="css/estilos.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            padding: 30px;
        }

        .caja {
            background-color: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        button,
.boton {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    background-color: white;
    color: #222;
    text-decoration: none;
    display: block;
    box-sizing: border-box;
}
        button img,
        .boton img {
            width: 30px;
            height: 30px;
            vertical-align: middle;
            margin-right: 8px;
        }

        a.volver {
            display: block;
            margin-top: 20px;
            color: #222;
        }
    </style>
</head>

<body>

    <div class="caja">
        <img 
        src="https://cdn-icons-png.flaticon.com/128/76/76897.png"
        alt="acensibilidad">

        <h1>Accesibilidad</h1>

        <p>
            Selecciona la opción que mejor se adapte a tus necesidades.
        </p>

        <button onclick="visual()">

            <img
                src="https://cdn-icons-png.flaticon.com/128/4836/4836896.png"
                alt="Accesibilidad visual">

            Accesibilidad visual

        </button>

        <button onclick="auditiva()">

            <img
                src="https://cdn-icons-png.flaticon.com/128/4807/4807755.png"
                alt="Accesibilidad auditiva">

            Accesibilidad auditiva

        </button>

        <a href="asistente IA.html" class="boton">
            <img 
            src="https://cdn-icons-png.flaticon.com/128/14669/14669697.png"
            alt="Asistente de IA">
            Asistente de IA
        </a>


        <p id="mensaje"></p>

        <a href="inicio.html" class="volver">
            ← Volver al inicio
        </a>

    </div>

    <script>

        function visual() {

            document.body.style.fontSize = "22px";

            document.getElementById("mensaje").innerText =
                "Modo visual activado. El texto se ha aumentado.";

        }

        function auditiva() {

            document.getElementById("mensaje").innerText =
                "Modo auditivo activado. La información importante se mostrará mediante texto.";

        }

    </script>

  <script src="js/script.js"></script>

</body>

</html>
