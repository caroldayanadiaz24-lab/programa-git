<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de sesión - Estilo y Moda 365</title>

    <link rel="stylesheet" href="css/estilos.css">


    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        /* LOGO */

        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            display: block;
            margin: 0 auto 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .boton {
            display: block;
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background-color: #222;
            color: white;
            border: none;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        .boton:hover {
            background-color: #444;
        }

        .olvido {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
        }

        .registro {
            text-align: center;
            margin-top: 25px;
        }

        .registro a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }

        .google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background-color: white;
            color: #222;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        .google:hover {
            background-color: #f5f5f5;
        }

        .google img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <!-- LOGO -->

        <img
            class="logo"
            src="C:\Users\carol\Downloads\logo.jpg"
            alt="Logo Estilo y Moda 365">


        <!-- TÍTULO -->

        <h1>
            Inicio de sesión
        </h1>


        <p class="subtitulo">
            Ingresa a tu cuenta para continuar
        </p>


        <!-- CORREO -->

        <label for="correo">
            Correo electrónico
        </label>

        <input
            type="email"
            id="correo">


        <!-- CONTRASEÑA -->

        <label for="contrasena">
            Contraseña
        </label>

        <input
            type="password"
            id="contrasena">


        <!-- INICIAR SESIÓN -->

        <a href="inicio.html" class="boton">
            Iniciar sesión
        </a>


        <!-- OLVIDÉ MI CONTRASEÑA -->

        <a href="#" class="olvido">
            ¿Olvidaste tu contraseña?
        </a>


        <!-- REGISTRO -->

        <div class="registro">

            <p>
                ¿No tienes una cuenta?
            </p>

            <a href="registro.html">
                Regístrate
            </a>

        </div>


        <!-- ACCESO CON GOOGLE -->

        <a href="#" class="google">

            <img
                src="https://cdn-icons-png.flaticon.com/512/281/281764.png"
                alt="Google">

            Acceso con Google

        </a>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
